name: Publish Pithos Guild

on:
  push:
    tags: ["pithos-kit.guild-v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pithos.guild

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Validate version matches package.json
        run: |
          TAG=${GITHUB_REF#refs/tags/pithos-kit.guild-v}
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "Tag version ($TAG) != package.json ($PKG_VERSION)"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Publish
        run: |
          VERSION=$(node -p "require('./package.json').version")
          case "$VERSION" in
            *-beta.*) npm publish --provenance --access public --tag beta ;;
            *-*) echo "Unsupported Guild prerelease channel: $VERSION" >&2; exit 1 ;;
            *) npm publish --provenance --access public ;;
          esac
